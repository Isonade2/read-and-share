name: Dev CI on WSL Runner

on:
  push:
    branches:
      - develop        # dev 브랜치에 대한 push 이벤트에만 트리거
  pull_request:
    branches:
      - develop        # (선택) PR이 dev 브랜치로 생성/병합될 때도 트리거

jobs:
  build-and-deploy:
    runs-on: self-hosted  # 앞서 등록한 WSL 러너에서 실행

    env:
        DATA_REDIS_HOST: ${{ secrets.DATA_REDIS_HOST }}
        DB_URL: ${{ secrets.DB_URL }}      # H2 메모리 DB 사용
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}  # 이메일 비밀번호
        JPA_DDI: ${{ secrets.JPA_DDI }}               # DataSource 초기화 지연: 비활성화
        JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO }}         # JPA DDL 자동 생성: 업데이트
        NAVER_BOOK_ID: ${{ secrets.NAVER_BOOK_ID }}       # 네이버 책 API ID
        NAVER_BOOK_SECRET: ${{ secrets.NAVER_BOOK_SECRET }}   # 네이버 책 API 비밀번호
        SQL_INIT_MODE: ${{ secrets.EMAIL_PASSWORD }}        # SQL 초기화 모드: 항상





    steps:


      # 코드 가져오기
      - name: Check out code
        uses: actions/checkout@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Gradle 빌드 및 테스트
      - name: Run unit tests
        run: ./gradlew test

      - name: Stop existing app
        if: ${{ success() }}
        run: |
          # 실행 중인 기존 Spring Boot 애플리케이션 종료
          pkill -f 'java.*myapp.jar' || echo "No running instance found."

      - name: Build new JAR
        if: ${{ success() }}
        run: ./gradlew build -x test

      - name: Launch updated app
        if: ${{ success() }}
        run: |
          # 새로 빌드된 JAR 백그라운드 실행
          nohup java -jar build/libs/myapp.jar --spring.profiles.active=dev > app.log 2>&1 &
